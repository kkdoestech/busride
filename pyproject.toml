[project]
name = "busride"
version = "0.2.0"
description = "Ride the Bus, solved: play with a coach, benchmark AI agents against perfect play, train RL agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ride the bus", "card game", "probability", "llm benchmark", "reinforcement learning", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "scipy>=1.11",
    "platformdirs>=4",
    "anthropic>=2.3.0",
    "openai>=3.37.0",
]

[project.urls]
Homepage = "https://github.com/kkdoestech/busride"
Issues = "https://github.com/kkdoestech/busride/issues"

[project.scripts]
busride = "busride.cli:main"
bus = "busride.cli:main"  # old name, kept for one release

[project.optional-dependencies]
rl = [
    "gymnasium>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/busride"]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "gymnasium>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # card glyphs and box characters are intentional

[tool.mypy]
python_version = "3.11"
files = ["src/busride"]
strict = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
