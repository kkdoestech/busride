# busride game rules. Set these to match the game you play (docs/SPEC.md, section 5),
# then run `busride odds`.

[game]
name = "Ride the Bus, short deck"
game_version = "example"
captured_on = ""
description = "Ride the Bus with the 36-card deck (sixes to aces) used in many card games."
# true: the first guess must be played; false: you may walk away before it
forced_first_bet = true
# Stake limits; 0 = not recorded.
min_stake = 0
max_stake = 0
# What a draw that runs out of time does: unknown | lose | cash_out | random_guess
timeout = "unknown"

[deck]
# fresh_52 (new deck every round) | with_replacement (cards can repeat) | shoe
model = "fresh_52"
# Only used by "shoe".
decks = 1
# high | low | either (either = whichever value helps you)
ace = "high"
# Ranks in the deck (14 = ace); leave out for a full deck.
ranks = [6, 7, 8, 9, 10, 11, 12, 13, 14]

[ties]
# lose | push | win. A push ends the round and pays your current cash-out value.
higher_lower = "lose"
# The same, for a card equal to either end of the inside/outside range.
range_edge = "lose"

# The stages, in order: colour | higher_lower | inside_outside | suit | reveal.
# higher_lower compares with the previous card unless `against = N`; inside_outside
# with the two previous cards unless `between = [A, B]` (stage numbers).
[[stage]]
type = "colour"

[[stage]]
type = "higher_lower"

[[stage]]
type = "inside_outside"

[[stage]]
type = "suit"

[payout]
# Total payout per 1 staked, stake included, for cashing out after each guessing
# stage (reveal stages don't count).
ladder = [1.67, 2.35, 3.75, 13.74]
