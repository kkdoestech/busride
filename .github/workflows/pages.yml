name: Pages

# Publishes the live banner (banner/site/) to https://kkdoestech.github.io/busride/.

on:
  push:
    branches: [main]
    paths: ["banner/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: banner/site
      - id: deployment
        uses: actions/deploy-pages@v5
