  <style>
    :root {
      --bg: #07070c;

    .corner a, .corner code {

    .corner code { font: 500 13px ui-monospace, Consolas, monospace; color: var(--gold); }
    .hint { position: fixed; left: 16px; bottom: 12px; margin: 0; color: var(--muted); font-size: 12px; }
    body.record #stage { width: 900px; height: 300px; inset: auto; top: 0; left: 0; cursor: default; }
    body.record .corner, body.record .hint { display: none; }
